<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 160" width="100%" height="100%">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00c6ff" />
      <stop offset="100%" stop-color="#0052d4" />
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    <linearGradient id="wrenchGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2af598" />
      <stop offset="100%" stop-color="#009efd" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dynamic Swirling Orbit -->
  <path d="M 30,85 C 20,40 55,18 105,18 C 145,18 175,35 185,60" fill="none" stroke="url(#blueGrad)" stroke-width="6" stroke-linecap="round" />
  <path d="M 170,80 C 180,120 145,145 95,145 C 55,145 25,125 15,100" fill="none" stroke="url(#tealGrad)" stroke-width="6" stroke-linecap="round" opacity="0.85" />

  <!-- Digital Tech Pixels / Floating Data Blocks -->
  <rect x="155" y="32" width="10" height="10" rx="2" fill="#00c6ff" />
  <rect x="170" y="24" width="8" height="8" rx="2" fill="#4facfe" />
  <rect x="172" y="38" width="11" height="11" rx="2" fill="#0052d4" />
  <rect x="160" y="47" width="9" height="9" rx="2" fill="#00f2fe" />
  <rect x="175" y="53" width="7" height="7" rx="1.5" fill="#2af598" />

  <!-- Monitor Frame -->
  <rect x="42" y="36" width="92" height="68" rx="8" fill="#0a192f" stroke="url(#blueGrad)" stroke-width="5" />
  <!-- Screen inner display -->
  <rect x="49" y="43" width="78" height="52" rx="4" fill="#030b17" />
  <!-- Monitor Stand -->
  <path d="M 80,104 L 75,116 L 101,116 L 96,104 Z" fill="url(#blueGrad)" />
  <rect x="68" y="116" width="40" height="5" rx="2.5" fill="url(#blueGrad)" />

  <!-- "TS" Letters inside monitor -->
  <text x="63" y="82" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-weight="900" font-size="34" fill="#ffffff" letter-spacing="-1">TS</text>
  <text x="63" y="82" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-weight="900" font-size="34" fill="url(#tealGrad)" opacity="0.6" letter-spacing="-1">TS</text>

  <!-- Technician Wrench Tool wrapping around monitor -->
  <g transform="rotate(-38 122 96)">
    <!-- Wrench handle -->
    <rect x="114" y="65" width="16" height="58" rx="6" fill="url(#wrenchGrad)" />
    <!-- Wrench head -->
    <path d="M 112,65 C 105,58 107,42 122,42 C 137,42 139,58 132,65 L 128,65 L 128,52 L 116,52 L 116,65 Z" fill="url(#wrenchGrad)" />
    <!-- Wrench bottom ring -->
    <circle cx="122" cy="116" r="5" fill="#030b17" />
  </g>
</svg>
